<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><title>QR Attendance</title><script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script><style>body{margin:0;background:#07111f;color:white;font-family:Arial}.app{max-width:600px;margin:auto;padding:15px}.card{background:#0e1b2f;padding:15px;border-radius:16px;margin:10px 0}input,select,button{width:100%;padding:13px;margin:5px 0;border-radius:10px;font-size:16px;box-sizing:border-box}input,select{background:#091525;color:white;border:1px solid #345}button{border:0;font-weight:bold;background:#38bdf8}#reader{background:#000;border-radius:12px;overflow:hidden}.stats{display:flex;gap:8px}.stat{flex:1;text-align:center;background:#14243e;padding:10px;border-radius:10px}.ok{color:#22c55e}.warn{color:#f59e0b}.err{color:#ef4444}</style></head><body><div class="app"><h1>QR Attendance</h1><div class="card"><input id="ta" placeholder="TA name"><select id="session"><option>Lec</option><option>Lab</option></select><p>Date: <b id="date">—</b> &nbsp; Time: <b id="time">—</b></p></div><div class="card"><div id="reader"></div><button id="start" onclick="start()">📷 START CAMERA</button><button id="stop" onclick="stop()" style="display:none;background:#334155;color:white">STOP</button><p id="msg">Tap Start Camera. Your phone should ask for camera permission.</p></div><div class="card"><div class="stats"><div class="stat"><b id="total">0</b><small>TOTAL</small></div><div class="stat"><b id="present" class="ok">0</b><small>PRESENT</small></div><div class="stat"><b id="remaining" class="warn">0</b><small>REMAINING</small></div></div></div><div class="card"><h2 id="name">No scan yet</h2><p id="detail">Scan a student QR.</p></div><div class="card"><button onclick="fin()" style="background:#22c55e">FINALIZE SESSION</button></div></div><script>const BACKEND_URL='https://script.google.com/a/macros/iitj.ac.in/s/AKfycbyuce-Wtp8WvPISwji41fSlaNkajN9ln-jzz_Q2kdFh8Pv2RopfrLuazwzzc5LEh8_-/exec';let scanner=null,running=false,students=[],present={},last='',lastAt=0;const $=x=>document.getElementById(x);function cb(p){return new Promise((res,rej)=>{let n='cb'+Date.now()+Math.random().toString(36).slice(2),s=document.createElement('script'),t=setTimeout(()=>{delete window[n];s.remove();rej(Error('Backend timeout'))},15000);window[n]=x=>{clearTimeout(t);delete window[n];s.remove();res(x)};s.onerror=()=>{clearTimeout(t);delete window[n];s.remove();rej(Error('Backend unavailable'))};s.src=BACKEND_URL+'?'+new URLSearchParams({...p,callback:n});document.body.appendChild(s)})}async function init(){if(BACKEND_URL.includes('PASTE_')){$('msg').textContent='Set BACKEND_URL in index.html';return}try{let d=await cb({action:'init'});students=d.students||[];$('date').textContent=d.displayDate;$('time').textContent=d.time;$('total').textContent=students.length;state()}catch(e){$('msg').textContent=e.message}}function state(){cb({action:'state',ta:$('ta').value,session:$('session').value}).then(d=>{present=d.present||{};stats()})}function stats(){let p=Object.keys(present).length;$('present').textContent=p;$('remaining').textContent=Math.max(0,students.length-p)}async function start(){
  const ta = $('ta').value.trim();
  if(!ta){
    alert('Please enter TA name first.');
    $('ta').focus();
    return;
  }
  if(running) return;

  try{
    // IMPORTANT: Let html5-qrcode open the camera directly.
    // This allows the phone browser to show its native camera permission prompt.
    scanner = new Html5Qrcode('reader');

    await scanner.start(
      {facingMode:'environment'},
      {
        fps:10,
        qrbox:function(viewfinderWidth, viewfinderHeight){
          const size=Math.min(
            Math.floor(viewfinderWidth*0.72),
            Math.floor(viewfinderHeight*0.72),
            300
          );
          return {width:size,height:size};
        },
        aspectRatio:1.0
      },
      scan,
      function(errorMessage){
        // Normal QR decode failures are ignored while searching.
      }
    );

    running=true;
    $('start').style.display='none';
    $('stop').style.display='block';
    $('msg').textContent='Camera active. Scan QR codes.';
    $('msg').className='ok';

  }catch(e){
    console.error('Camera start error:',e);

    if(scanner){
      try{await scanner.clear();}catch(ignore){}
      scanner=null;
    }

    const text=String(e && (e.message||e.name||e) || '');
    let message='Camera could not start.';

    if(/NotAllowedError|PermissionDeniedError|permission/i.test(text)){
      message='Camera permission was denied or blocked. Tap START CAMERA again and choose Allow.';
    }else if(/NotFoundError|DevicesNotFoundError/i.test(text)){
      message='No camera was found on this phone.';
    }else if(/NotReadableError|TrackStartError/i.test(text)){
      message='The camera is busy or unavailable. Close other apps using the camera and try again.';
    }else if(/NotSupportedError|secure context|HTTPS/i.test(text)){
      message='Camera requires a secure HTTPS website. Open the HTTPS GitHub Pages link.';
    }else if(text){
      message='Camera error: '+text;
    }

    $('name').textContent='CAMERA COULD NOT START';
    $('detail').textContent=message;
    $('msg').textContent=message;
    $('msg').className='err';
  }
}

async function stop(){
  if(scanner){
    try{await scanner.stop();}catch(ignore){}
    try{scanner.clear();}catch(ignore){}
    scanner=null;
  }
  running=false;
  $('start').style.display='block';
  $('stop').style.display='none';
  $('msg').textContent='Camera stopped.';
  $('msg').className='';
}

async function scan(text){
  const now=Date.now();
  if(text===last && now-lastAt<1800)return;
  last=text;
  lastAt=now;

  let roll=text.trim().split('|')[0].trim();
  if(!roll)return;

  const key=roll.toUpperCase();

  // Validate locally first — no network round trip required.
  const student=students.find(
    s=>s.roll.toUpperCase()===key
  );

  if(!student){
    $('name').textContent='INVALID QR';
    $('detail').textContent='Student is not in the Name List.';
    $('msg').textContent='Invalid QR.';
    $('msg').className='err';
    return;
  }

  const duplicate=!!present[key];

  // Update the phone UI IMMEDIATELY.
  // This removes the network delay between students.
  if(!duplicate){
    present[key]=true;
  }

  $('name').textContent=student.name;
  $('detail').textContent=
    student.roll+' • '+new Date().toLocaleTimeString()+
    ' • '+(duplicate?'Already present':'✓ Present');

  stats();

  $('msg').textContent=
    duplicate
      ? 'Duplicate scan — attendance unchanged.'
      : '✓ Present — next student can scan.';
  $('msg').className=duplicate?'':'ok';

  /*
   * Send the raw scan to Google Sheets in the background.
   * We do NOT wait for this request.
   *
   * FINALIZE will guarantee that every locally confirmed
   * present student is written to Attendance Log before
   * Subject Roll List is updated.
   */
  cb({
    action:'scan',
    ta:$('ta').value,
    session:$('session').value,
    roll:student.roll
  }).catch(e=>{
    // Do not interrupt scanning because the finalization
    // endpoint will repair missing raw log records.
    console.warn('Background scan log:',e);
  });
}

async function fin(){
  const rolls=Object.keys(present);
  if(!rolls.length){
    alert('No students are marked present on this phone yet.');
    return;
  }
  if(!confirm('Finalize today? All other students will be marked A.'))return;
  try{
    $('msg').textContent='Finalizing attendance…';
    const d=await cb({
      action:'finalize',
      ta:$('ta').value,
      session:$('session').value,
      present:rolls.join(',')
    });
    if(!d.ok)throw Error(d.error||'Finalize failed');
    alert('Finalized
Present: '+d.present+'
Absent: '+d.absent+'
Total: '+d.total);
    $('msg').textContent='✓ Attendance updated in Subject Roll List.';
    $('msg').className='ok';
  }catch(e){
    $('msg').textContent=e.message;
    $('msg').className='err';
  }
});alert('Finalized\nPresent: '+d.present+'\nAbsent: '+d.absent)}catch(e){alert(e.message)}}$('ta').onchange=state;$('session').onchange=state;setInterval(()=>{$('time').textContent=new Date().toLocaleTimeString()},1000);init();</script></body></html>
