<!doctype html>
<html>
<head>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>QR Attendance — IITJ v3</title>
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<style>
body{margin:0;background:#07111f;color:#fff;font-family:Arial,sans-serif}
.app{max-width:600px;margin:auto;padding:15px}
h1{font-size:25px;margin:5px 0 14px}
.card{background:#0e1b2f;padding:14px;border-radius:16px;margin:10px 0}
input,select,button{width:100%;padding:13px;margin:5px 0;border-radius:10px;font-size:16px;box-sizing:border-box}
input,select{background:#091525;color:#fff;border:1px solid #345}
button{border:0;font-weight:bold;background:#38bdf8;color:#062033}
#reader{background:#000;border-radius:12px;overflow:hidden;min-height:0}
#stop{background:#334155;color:#fff}
#finalize{background:#22c55e;color:#03180b}
.stats{display:flex;gap:8px}
.stat{flex:1;text-align:center;background:#14243e;padding:10px;border-radius:10px}
.stat b{display:block;font-size:21px}
.stat small{font-size:10px;color:#94a3b8}
.ok{color:#22c55e}.warn{color:#f59e0b}.err{color:#ef4444}
#msg{font-size:12px;line-height:1.4}
.note{font-size:11px;color:#94a3b8;line-height:1.45}
</style>
</head>
<body>
<div class="app">
<h1>QR Attendance</h1>

<div class="card">
  <input id="ta" placeholder="TA name">
  <select id="session">
    <option>Lec</option>
    <option>Lab</option>
  </select>
  <p>Date: <b id="date">—</b> &nbsp; Time: <b id="time">—</b></p>
</div>

<div class="card">
  <div id="reader"></div>
  <button id="start" onclick="startCamera()">📷 START CAMERA</button>
  <button id="stop" onclick="stopCamera()" style="display:none">STOP CAMERA</button>
  <p id="msg">Connecting to attendance backend…</p>
  <div class="note">The camera is independent of Google Sheets. Attendance is synced to the sheet in the background.</div>
</div>

<div class="card">
  <div class="stats">
    <div class="stat"><b id="total">0</b><small>TOTAL</small></div>
    <div class="stat"><b id="present" class="ok">0</b><small>PRESENT</small></div>
    <div class="stat"><b id="remaining" class="warn">0</b><small>REMAINING</small></div>
  </div>
</div>

<div class="card">
  <h2 id="name">No scan yet</h2>
  <p id="detail">Scan a student QR.</p>
</div>

<div class="card">
  <button id="finalize" onclick="finalizeSession()">FINALIZE SESSION</button>
</div>
</div>

<script>
const BACKEND_URL="https://script.google.com/a/macros/iitj.ac.in/s/AKfycbyuce-Wtp8WvPISwji41fSlaNkajN9ln-jzz_Q2kdFh8Pv2RopfrLuazwzzc5LEh8_-/exec";
let scanner=null;
let running=false;
let students=[];
let studentMap={};
let present={};
let lastQR='';
let lastAt=0;

const $=id=>document.getElementById(id);

function showMessage(text, cls=''){
  $('msg').textContent=text;
  $('msg').className=cls;
}

function updateClock(){
  const now=new Date();
  $('date').textContent=now.toLocaleDateString('en-IN',{
    day:'2-digit',month:'short',year:'numeric'
  });
  $('time').textContent=now.toLocaleTimeString('en-IN',{
    hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false
  });
}
updateClock();
setInterval(updateClock,1000);

function updateStats(){
  const p=Object.keys(present).length;
  $('total').textContent=students.length;
  $('present').textContent=p;
  $('remaining').textContent=Math.max(0,students.length-p);
}

function jsonp(params){
  return new Promise((resolve,reject)=>{
    if(!BACKEND_URL || BACKEND_URL.includes('PASTE_YOUR')){
      reject(new Error('Apps Script backend URL is not configured.'));
      return;
    }

    const cb='qr_'+Date.now()+'_'+Math.random().toString(36).slice(2);
    const script=document.createElement('script');
    const timeout=setTimeout(()=>{
      cleanup();
      reject(new Error('Backend timeout'));
    },10000);

    window[cb]=data=>{
      cleanup();
      resolve(data);
    };

    script.onerror=()=>{
      cleanup();
      reject(new Error('Backend unavailable'));
    };

    script.src=BACKEND_URL+'?'+new URLSearchParams({
      ...params,callback:cb
    }).toString();

    document.body.appendChild(script);

    function cleanup(){
      clearTimeout(timeout);
      try{delete window[cb]}catch(e){}
      script.remove();
    }
  });
}

async function loadBackend(){
  if(BACKEND_URL.includes('PASTE_YOUR')){
    $('total').textContent='—';
    showMessage('Camera is ready, but the Apps Script URL is not configured.','err');
    return;
  }

  try{
    const d=await jsonp({action:'init'});

    if(!d.ok) throw new Error(d.error||'Backend error');

    students=d.students||[];
    studentMap={};

    students.forEach(s=>{
      studentMap[String(s.roll).trim().toUpperCase()]=s;
    });

    updateStats();

    // Restore this TA/session's already recorded scans if available.
    await refreshState();

    showMessage('Ready. Enter TA name and start camera.','ok');

  }catch(e){
    // IMPORTANT: Do not block the camera because Google Sheets is slow/unavailable.
    showMessage('Camera is ready. Sheet sync is temporarily unavailable.','warn');
  }
}

async function refreshState(){
  if(!BACKEND_URL || BACKEND_URL.includes('PASTE_YOUR')) return;

  const ta=$('ta').value.trim();
  if(!ta)return;

  try{
    const d=await jsonp({
      action:'state',
      ta:ta,
      session:$('session').value
    });

    if(d.ok){
      present=d.present||{};
      updateStats();
    }
  }catch(e){}
}

$('ta').addEventListener('change',refreshState);
$('session').addEventListener('change',refreshState);

async function startCamera(){
  const ta=$('ta').value.trim();

  if(!ta){
    alert('Please enter TA name first.');
    $('ta').focus();
    return;
  }

  if(running)return;

  try{
    if(typeof Html5Qrcode==='undefined'){
      throw new Error('QR scanner library did not load. Check your internet connection and reload the page.');
    }

    scanner=new Html5Qrcode('reader');

    await scanner.start(
      {facingMode:'environment'},
      {
        fps:4,
        qrbox:function(w,h){
          const size=Math.min(
            Math.floor(w*0.72),
            Math.floor(h*0.72),
            300
          );
          return {width:size,height:size};
        },
        aspectRatio:1.0
      },
      onScan,
      ()=>{}
    );

    running=true;
    $('start').style.display='none';
    $('stop').style.display='block';
    showMessage('Camera active. Scan QR codes.','ok');

  }catch(e){
    console.error(e);

    if(scanner){
      try{await scanner.clear()}catch(ignore){}
      scanner=null;
    }

    const msg=String(e.message||e);

    if(/NotAllowed|Permission|denied/i.test(msg)){
      showMessage('Camera permission was denied. Tap START CAMERA again and choose Allow.','err');
    }else if(/NotFound|DevicesNotFound/i.test(msg)){
      showMessage('No camera was found on this device.','err');
    }else if(/NotReadable|TrackStart/i.test(msg)){
      showMessage('Camera is busy. Close another camera app and try again.','err');
    }else{
      showMessage('Camera error: '+msg,'err');
    }
  }
}

async function stopCamera(){
  if(scanner){
    try{await scanner.stop()}catch(ignore){}
    try{scanner.clear()}catch(ignore){}
    scanner=null;
  }

  running=false;
  $('start').style.display='block';
  $('stop').style.display='none';
  showMessage('Camera stopped.');
}

function findStudent(roll){
  return studentMap[String(roll).trim().toUpperCase()]||null;
}

async function onScan(decodedText){
  const now=Date.now();

  if(decodedText===lastQR && now-lastAt<1800)return;

  lastQR=decodedText;
  lastAt=now;

  const roll=String(decodedText).trim().split('|')[0].trim();
  const student=findStudent(roll);

  if(!student){
    $('name').textContent='INVALID QR';
    $('detail').textContent='This roll number is not in Name List.';
    showMessage('Invalid student QR.','err');
    return;
  }

  const key=String(student.roll).trim().toUpperCase();
  const duplicate=!!present[key];

  // Immediate local update — no waiting for Google.
  if(!duplicate) present[key]=true;

  $('name').textContent=student.name;
  $('detail').textContent=
    student.roll+' • '+new Date().toLocaleTimeString()+
    ' • '+(duplicate?'Already present':'✓ Present');

  updateStats();

  showMessage(
    duplicate
      ? 'Duplicate scan — attendance unchanged.'
      : '✓ Present — ready for next student.',
    duplicate?'':'ok'
  );

  // Background logging only.
  if(!duplicate && BACKEND_URL && !BACKEND_URL.includes('PASTE_YOUR')){
    jsonp({
      action:'scan',
      ta:$('ta').value.trim(),
      session:$('session').value,
      roll:student.roll
    }).catch(e=>console.warn('Background scan:',e));
  }
}

async function finalizeSession(){
  const rolls=Object.keys(present);

  if(!rolls.length){
    alert('No students are marked present on this phone.');
    return;
  }

  if(!BACKEND_URL || BACKEND_URL.includes('PASTE_YOUR')){
    alert('Apps Script backend URL is not configured.');
    return;
  }

  if(!confirm(
    'Finalize today?\\n\\n' +
    'Present: '+rolls.length+'\\n' +
    'All other students will be marked A.'
  ))return;

  try{
    $('finalize').disabled=true;
    showMessage('Finalizing attendance…');

    const d=await jsonp({
      action:'finalize',
      ta:$('ta').value.trim(),
      session:$('session').value,
      present:rolls.join(',')
    });

    if(!d.ok)throw new Error(d.error||'Finalize failed');

    alert(
      'Finalized\\n\\n'+
      'Present: '+d.present+
      '\\nAbsent: '+d.absent+
      '\\nTotal: '+d.total
    );

    showMessage(
      '✓ Attendance updated in Subject Roll List.',
      'ok'
    );

  }catch(e){
    alert('Finalization failed: '+e.message);
    showMessage('Finalization failed: '+e.message,'err');
  }finally{
    $('finalize').disabled=false;
  }
}

loadBackend();
</script>
</body>
</html>
